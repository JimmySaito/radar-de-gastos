[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "usage-hub"
version = "0.1.0"
description = "Plataforma centralizada de observabilidad de consumo (FinOps) para proveedores de IA y nube: Anthropic, OpenAI, Google, AWS y fuentes personalizadas."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "UsageHub Team" }]
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "anthropic>=2.9,<3",
  "aws-lambda-powertools[tracer]>=3.0,<4",
]

[project.optional-dependencies]
# boto3 ya viene incluido en el runtime de Lambda; se declara para desarrollo local.
aws = ["boto3>=1.35"]
gcp = ["google-cloud-bigquery>=3.25"]
dev = [
  "boto3>=1.35",
  "boto3-stubs[dynamodb,sqs,secretsmanager,sns,ce]",
  "pytest>=8",
  "pytest-cov>=5",
  "moto[dynamodb,sqs,secretsmanager,sns,ce]>=5",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usage_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=usage_hub --cov-report=term-missing --cov-fail-under=80"
markers = [
  "integration: pruebas con AWS emulado (moto)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "N", "C4", "RET"]
# PLC0415: las importaciones diferidas son deliberadas (reducen el arranque en frío de Lambda).
# RUF001-003: el código está documentado en español (tildes, «→», «×»).
ignore = ["PLR0913", "S101", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "PLR0915", "PT018"]
"scripts/**" = ["S", "T20", "PLR2004", "PLR0915", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["usage_hub"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*", "aws_xray_sdk.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "scripts"]

[tool.coverage.run]
branch = true
source = ["usage_hub"]
omit = ["src/usage_hub/connectors/google_billing.py"]
