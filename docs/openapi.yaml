openapi: 3.1.0
info:
  title: UsageHub API
  version: 0.1.0
  description: |
    API de observabilidad de consumo de IA y nube. Autenticación con JWT de Amazon Cognito:
    - Usuarios del dashboard: id token (Authorization Code + PKCE). El tenant sale de `custom:tenant_id`.
    - Sistemas externos: access token `client_credentials` con scope `usagehub/ingest`.
    El tenant **nunca** se envía en el cuerpo: lo determina el token.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    variables:
      apiId: { default: example }
      region: { default: us-east-1 }
security:
  - cognito: []
paths:
  /v1/health:
    get:
      summary: Health check
      security: []
      responses:
        "200": { description: OK }
  /v1/summary:
    get:
      summary: KPIs del dashboard para un rango de fechas
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { $ref: "#/components/parameters/dataset" }]
      responses:
        "200":
          description: Resumen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Token ausente o inválido }
  /v1/timeseries:
    get:
      summary: Serie diaria de costo y tokens
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - name: group_by
          in: query
          schema: { type: string, enum: [provider, member, team, service], default: provider }
      responses:
        "200": { description: Serie temporal }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/usage/records:
    post:
      summary: Ingesta push de registros de consumo de cualquier sistema
      description: Procesamiento asíncrono (SQS). Idempotente por clave natural (service, principal, usage_date, provider).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/IngestRecord" }
      responses:
        "202":
          description: Aceptado para procesamiento
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  record_ids: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Falta el scope usagehub/ingest }
        "429": { description: Límite de tasa de API Gateway }
  /v1/mappings:
    get: { summary: Lista mapeos principal → persona/equipo, responses: { "200": { description: OK } } }
    delete:
      summary: Elimina un mapeo (admins)
      parameters:
        - { name: provider, in: query, required: true, schema: { $ref: "#/components/schemas/Provider" } }
        - { name: principal, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: OK } }
    put:
      summary: Crea o actualiza un mapeo (grupo admins)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrincipalMapping" }
      responses: { "200": { description: OK }, "403": { description: Requiere grupo admins } }
  /v1/me:
    get:
      summary: Tenant del token, permisos y tenant de ejemplo
      responses: { "200": { description: OK } }
  /v1/identities:
    get:
      summary: Identidades técnicas vistas en el rango, su gasto y si tienen persona/equipo asignados
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { $ref: "#/components/parameters/dataset" }]
      responses: { "200": { description: OK } }
  /v1/providers:
    get:
      summary: Catálogo de proveedores con los campos (credenciales y opciones) que pide cada uno
      responses: { "200": { description: OK } }
  /v1/connectors:
    get:
      summary: Conexiones del tenant con su último estado de sincronización (admins). Nunca incluye secretos.
      responses: { "200": { description: OK } }
    put:
      summary: Crea o edita una conexión (admins). Los campos secretos van a Secrets Manager; vacíos = conservar.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionRequest" }
      responses: { "200": { description: Conexión guardada }, "400": { description: Campos faltantes o desconocidos } }
  /v1/connectors/test:
    post:
      summary: Prueba credenciales leyendo los últimos 3 días, sin guardar nada (admins)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionRequest" }
      responses:
        "200":
          description: Resultado de la prueba (ok, registros, costo, error depurado)
  /v1/connectors/{connector_id}/sync:
    post:
      summary: Encola una sincronización inmediata (admins)
      parameters:
        - { name: connector_id, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31 } }
      responses: { "202": { description: En cola }, "404": { description: No existe } }
  /v1/connectors/{connector_id}:
    delete:
      summary: Elimina la conexión y su secreto (recuperable 7 días en Secrets Manager) (admins)
      parameters: [{ name: connector_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Eliminada }, "404": { description: No existe } }
  /v1/budgets:
    get: { summary: Presupuestos y gasto del mes en curso, responses: { "200": { description: OK } } }
    put:
      summary: Define un presupuesto mensual por equipo (admins)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [team, monthly_limit]
              properties:
                team: { type: string }
                provider: { $ref: "#/components/schemas/Provider" }
                monthly_limit: { type: string, example: "1500.00" }
      responses: { "200": { description: OK } }
  /v1/recurring/{scope}/catalog:
    get:
      summary: Servicios comunes (Netflix, Spotify, Slack…), categorías y ciclos de cobro para el formulario
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses: { "200": { description: OK } }
  /v1/recurring/{scope}:
    get:
      summary: Gastos recurrentes con su próximo cobro, personas, gasto por persona y el resumen del mes
      description: personal = de la persona del token (privado; dataset=demo para el hogar de ejemplo); business = del tenant.
      parameters:
        - { $ref: "#/components/parameters/scope" }
        - { $ref: "#/components/parameters/dataset" }
        - { name: member, in: query, schema: { type: string }, description: "Resumen solo de la parte de esa persona (o sin-asignar)" }
      responses: { "200": { description: OK }, "404": { description: Espacio desconocido } }
    put:
      summary: Crear o editar un gasto recurrente (business requiere el grupo admins)
      parameters: [{ $ref: "#/components/parameters/scope" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringRequest" }
      responses: { "200": { description: Guardado }, "400": { description: Validación }, "403": { description: Requiere admins (business) } }
  /v1/personal/profiles:
    get:
      summary: Personas del espacio personal (con dataset=demo, las del hogar de ejemplo)
      parameters: [{ $ref: "#/components/parameters/dataset" }]
      responses: { "200": { description: OK } }
    put:
      summary: Crear o renombrar una persona
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                profile_id: { type: string, description: "Vacío = nueva" }
                name: { type: string, maxLength: 60, example: Jimmy }
                relation: { type: string, maxLength: 40, example: Yo }
      responses: { "200": { description: OK }, "400": { description: Nombre duplicado o vacío } }
  /v1/personal/profiles/{profile_id}:
    delete:
      summary: Eliminar una persona (sus suscripciones se conservan y se le quitan)
      parameters: [{ name: profile_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "Eliminada; incluye expenses_updated" }, "404": { description: No existe } }
  /v1/recurring/{scope}/{expense_id}:
    delete:
      summary: Eliminar un gasto recurrente
      parameters:
        - { $ref: "#/components/parameters/scope" }
        - { name: expense_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Eliminado }, "404": { description: No existe } }
components:
  securitySchemes:
    cognito:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{domain}.auth.{region}.amazoncognito.com/oauth2/authorize
          tokenUrl: https://{domain}.auth.{region}.amazoncognito.com/oauth2/token
          scopes: { openid: Identidad, email: Correo }
        clientCredentials:
          tokenUrl: https://{domain}.auth.{region}.amazoncognito.com/oauth2/token
          scopes: { usagehub/ingest: Enviar registros de consumo }
  parameters:
    from: { name: from, in: query, schema: { type: string, format: date }, description: "Inclusivo. Por defecto: to - 30 días" }
    to: { name: to, in: query, schema: { type: string, format: date }, description: "Exclusivo. Por defecto: mañana (UTC)" }
    scope: { name: scope, in: path, required: true, schema: { type: string, enum: [personal, business] } }
    dataset: { name: dataset, in: query, schema: { type: string, enum: [demo] }, description: "demo = leer el tenant de ejemplo (solo lectura)" }
  responses:
    BadRequest: { description: Validación fallida (detalle de Pydantic en el cuerpo) }
  schemas:
    Provider: { type: string, enum: [anthropic, openai, google, aws, custom, synthetic] }
    IngestRecord:
      type: object
      additionalProperties: false
      required: [service, principal, usage_date]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        service: { type: string, maxLength: 256, example: claude-opus-5-5 }
        principal: { type: string, maxLength: 256, example: "user:alice" }
        usage_date: { type: string, format: date }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cached_tokens: { type: integer, minimum: 0 }
        requests: { type: integer, minimum: 0 }
        cost: { type: string, example: "12.345000", description: Decimal en USD }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: USD }
    PrincipalMapping:
      type: object
      required: [provider, principal, member, team]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        principal: { type: string }
        member: { type: string }
        team: { type: string }
    RecurringRequest:
      type: object
      additionalProperties: false
      required: [name, amount, billing_date]
      properties:
        expense_id: { type: string, description: "Vacío = nuevo" }
        name: { type: string, example: Netflix }
        service: { type: string, example: netflix, description: "Clave del catálogo" }
        category: { type: string, example: streaming }
        plan: { type: string, example: Estándar }
        amount: { type: string, example: "44900", description: "Precio por cobro (por usuario en business)" }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: COP }
        cycle: { type: string, enum: [weekly, monthly, quarterly, annual] }
        billing_date: { type: string, format: date, description: "Una fecha de cobro conocida (próxima o última)" }
        start_date: { type: string, format: date, description: "Suscrita desde (opcional)" }
        end_date: { type: string, format: date, description: "Cancelada desde (opcional)" }
        seats: { type: integer, minimum: 1, description: "Solo business" }
        owner: { type: string, description: "Solo business" }
        team: { type: string, description: "Solo business" }
        active: { type: boolean }
        notes: { type: string }
        member_ids: { type: array, items: { type: string }, description: "Personas (solo personal); varias = compartida" }
    ConnectionRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        connector_id: { type: string, description: "Vacío = nueva conexión" }
        provider: { $ref: "#/components/schemas/Provider" }
        label: { type: string, maxLength: 120 }
        values: { type: object, additionalProperties: { type: string }, description: "Campos definidos en /v1/providers" }
        enabled: { type: boolean, default: true }
        lookback_days: { type: integer, minimum: 1, maximum: 31, default: 3 }
    Metrics:
      type: object
      properties:
        cost: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cached_tokens: { type: integer }
        total_tokens: { type: integer }
        requests: { type: integer }
    Summary:
      type: object
      properties:
        tenant_id: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { $ref: "#/components/schemas/Metrics" }
        by_provider: { type: object, additionalProperties: { $ref: "#/components/schemas/Metrics" } }
        top_teams: { type: array, items: { type: object } }
        top_members: { type: array, items: { type: object } }
        top_services: { type: array, items: { type: object } }
