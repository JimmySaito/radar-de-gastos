name: Deploy

# Despliegue manual con aprobación del entorno (GitHub Environments) y credenciales
# temporales vía OIDC: no hay llaves de AWS de larga duración en el repositorio.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python scripts/build_lambda.py
      - working-directory: infra/terraform/envs/${{ inputs.environment }}
        run: |
          cp backend.tf.example backend.tf
          sed -i "s/REEMPLAZAR-tfstate-bucket/${{ vars.TF_STATE_BUCKET }}/" backend.tf
          terraform init -input=false
          terraform apply -input=false -auto-approve -var "cognito_domain_prefix=${{ vars.COGNITO_DOMAIN_PREFIX }}"
      - name: Smoke test
        working-directory: infra/terraform/envs/${{ inputs.environment }}
        run: curl -fsS "$(terraform output -raw api_url)/v1/health"
