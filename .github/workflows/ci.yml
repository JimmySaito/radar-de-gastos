name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: mypy
      - run: pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  security:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit pip-audit
      - run: bandit -q -r src -c pyproject.toml
      - run: pip-audit --strict --progress-spinner off -r <(pip install -q -e . && pip freeze --exclude-editable)
      - name: Checkov (IaC)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          # Bloquea el pipeline: cada excepción se justifica en el recurso (checkov:skip)
          # y se resume en docs/security.md.
          soft_fail: false

  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate
        working-directory: infra/terraform/envs/dev
        run: |
          mkdir -p ../../../../dist && touch ../../../../dist/app.zip ../../../../dist/layer.zip
          terraform init -backend=false
          terraform validate

  package:
    name: Empaquetado Lambda (arm64)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_lambda.py
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: dist/*.zip
